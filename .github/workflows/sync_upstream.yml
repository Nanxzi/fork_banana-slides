name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * *'  # 北京12点 UTC时间4点执行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许写入代码
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 新增：拉取完整历史，避免合并时的历史缺失问题

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Anionex/banana-slides.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream/main into main
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories -X theirs || true
          git add .
          git commit -m "auto-resolve conflict using upstream (theirs)" || true
          
      - name: Push changes
        run: |
          # 优先移除 --force，仅在必要时使用（建议尽量避免强制推送）
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
